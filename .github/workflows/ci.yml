name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Installer and skill installation in the SLICC kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/test-kernel.sh
