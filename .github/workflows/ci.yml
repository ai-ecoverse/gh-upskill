name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Installer and skill installation in the SLICC kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/test-kernel.sh

      - name: The npm package with pnpm add -g and as a tools root in the SLICC kernel
        run: bash tests/test-package-kernel.sh

  release:
    needs: [build, kernel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
